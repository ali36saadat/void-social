<div class="profile">
  <div class="profile__header">
    <div class="profile__header-left">
      <a class="profile__header-left-close" routerLink="/mainPage/profile">&#x276E;</a>
      <span class="profile__header-left-title">Edit Profile</span>
    </div>
    <div class="profile__header-right">
      <a class="profile__header-right-save">Save</a>
    </div>
  </div>

  <form action="" class="profile__edit">
    <div class="profile__edit-inputs">
      <div class="profile__edit-name">
        <div class="profile__edit-namefirst">
          <span class="profile__edit-namefirst-title">First Name</span>
          <input class="profile__edit-namefirst-input" type="text" />
        </div>
        <div class="profile__edit-namelast">
          <span class="profile__edit-namelast-title">Last Name</span>
          <input class="profile__edit-namelast-input" type="text" />
        </div>
      </div>
      <div class="profile__edit-username">
        <span class="profile__edit-username-title">Username</span>
        <input class="profile__edit-username-input" type="text" name="" id="" />
      </div>
      <div class="profile__edit-bio">
        <span class="profile__edit-bio-title">Bio</span>
        <textarea class="profile__edit-bio-textarea" name="" id=""></textarea>
      </div>
    </div>
  </form>
</div>
